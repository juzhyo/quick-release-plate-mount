<section id="buy" class="buybar" data-state="collapsed" aria-label="Purchase">
  <div class="buybar__inner">
    <div class="buybar__row">
      <div class="buybar__price">
        <span class="buybar__amount" id="buybar-price">{{ printf "S$%.2f" .Site.Params.priceSGD }}</span>
        <span class="buybar__unit" id="buybar-summary">One Bumper (front + back)</span>
      </div>

      <button id="buybar-toggle" type="button" class="buybar__cta"
              aria-expanded="false" aria-controls="buybar-form">
        Buy
      </button>
    </div>

    <div id="buybar-form" class="buybar__form" hidden>
      <div class="buybar__field">
        <label for="variant">Kit</label>
        <select id="variant">
          <option value="one" data-price="{{ printf "%.2f" .Site.Params.priceSGD }}">
            One Bumper — {{ printf "S$%.2f" .Site.Params.priceSGD }}
          </option>
          <option value="two" data-price="{{ printf "%.2f" .Site.Params.priceTwoSGD }}">
            Two Bumper — {{ printf "S$%.2f" .Site.Params.priceTwoSGD }}
          </option>
        </select>
      </div>

      <div class="buybar__field buybar__field--grow">
        <label for="dest-country">Ship to</label>
        <select id="dest-country">
          <option value="SG">Singapore</option>
          <option value="MY">Malaysia</option>
          <option value="US">United States</option>
          <option value="GB">United Kingdom</option>
          <option value="AU">Australia</option>
        </select>
      </div>

      <div class="buybar__field buybar__field--grow">
        <label for="dest-postal">Postal code</label>
        <input id="dest-postal" type="text" inputmode="numeric" placeholder="e.g. 018956">
      </div>

      <button id="get-rates" type="button" class="buybar__secondary">Get shipping</button>

      <div id="rate-options" class="buybar__rates" aria-live="polite"></div>

      <button id="checkout" type="button" class="buybar__checkout" disabled>
        Checkout
      </button>
    </div>

    <p id="buybar-status" class="buybar__status" role="status"></p>
  </div>
</section>
